[project]
name = "tracs"
authors = [{ name = "fortysix2ahead", email = "fortysix2ahead@gmail.com" }]
maintainers = [{ name = "fortysix2ahead", email = "fortysix2ahead@gmail.com" }]
version = "0.2.0"
description = "Command Line Manager for GPS Tracks"
readme = "README.md"
keywords = ["cli", "terminal", "command line", "gps", "gpx", "tcx"]
license = {text = "MIT"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
requires-python = '>=3.11'
dependencies = [
    'arrow~=1.4.0',
    "attrs~=26.1.0",
    "beautifulsoup4~=4.15.0",
    'Babel~=2.18.0',
    'cattrs~=26.1.0',
    "click~=8.4.2",
    'click-shell~=2.1.0',
    'DateTimeRange~=2.3.2',
    "dynaconf~=3.3.2",
    'fs~=2.4.16',
    "geojson~=3.3.0",
    'gpxpy~=1.6.1',
    'isodate~=0.7.2',
    "lxml~=6.1.1",
    "more-itertools~=11.1.0",
    'oauthlib~=3.3.1',
    'orjson~=3.11.7',
    "platformdirs~=4.10.0",
    'python-dateutil~=2.9.0',
    'PyYAML~=6.0.3',
    "requests~=2.34.2",
    'requests-cache~=1.3.1',
    'requests-oauthlib~=2.0.0',
    "rich~=15.0.0",
    "rule-engine~=5.0.0",
		'setuptools~=80.0.1',
    "stravalib~=2.5.0",
    'tcxreader~=0.4.11',
    "tzlocal~=5.4.4",
]

[project.optional-dependencies]
dev = [
    'bumpver~=2025.1131',
    'cheroot~=11.1.2',
    'flit~=3.12.0',
    'mkdocs~=1.6.0',
    'mkdocs-click~=0.9.0',
    'mkdocs-material~=9.7.3',
    'pytest~=9.1.1',
    'wsgidav~=4.3.4',
]

[project.urls]
"Homepage" = "https://github.com/fortysix2ahead/tracs/"
"Source Code" = "https://github.com/fortysix2ahead/tracs/"
"Issue Tracker" = "https://github.com/fortysix2ahead/tracs/issues/"
Documentation = "https://tracs.readthedocs.io/"
Source = "https://github.com/fortysix2ahead/tracs/"

[project.scripts]
tracs = "tracs.__main__:main"

# [build-system]
# requires = ["setuptools>=61.0.0", "wheel"]
# build-backend = "setuptools.build_meta"
[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[tool.bumpver]
current_version = "0.2.0"
version_pattern = "MAJOR.MINOR.PATCH[-INC0]"
commit_message = "Increased version from {old_version} to {new_version}"
tag_message = "release/{new_version}"
tag_scope = "default"
pre_commit_hook = ""
post_commit_hook = ""
commit = false
tag = false
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = ['version = "{version}"']
# "setup.py" = ["{version}", "{pep440_version}", ]
# "README.md" = ["{version}", "{pep440_version}",]
"tracs/__init__.py" = [ '{version}' ]
