
library:
debug: false
verbose: true
force: false
pluginpath:

db:
  cache_size: 0
  index: false

formats:
  table:
    box: ascii

plugins:
  polar:
    some_polar_plugin_config: true

  strava:
    some_strava_plugin_config: true

  waze:
    field_size_limit: 512000

services:
  polar: # this needs to be unique
    display_name: Polar Flow (fortysix2ahead)
    type: polar
    password: some_polar_password
    username: polar@example.com

  strava: # this needs to be unique
    display_name: Strava (fortysix2ahead)
    type: strava
    client_id: 1000
    client_secret: 1000000000000000000000000000000000000000
    username: strava@example.com
    password: some_strava_password
